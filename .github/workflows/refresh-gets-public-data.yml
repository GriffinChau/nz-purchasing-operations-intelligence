name: Build public NZ GETS data extracts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official MBIE data and generate summaries
        run: python3 scripts/get_gets_public_data.py --download
      - name: Commit published source-derived evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_data/gets/
          if git diff --cached --quiet; then
            echo "No public-data changes to commit"
          else
            git commit -m "Update public GETS award-notice data from MBIE"
            git push
          fi
